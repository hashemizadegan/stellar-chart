<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stellar Chart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" data-i18n="brand">Stellar Chart</a>
    <div class="top-actions">
      <button id="lang" class="lang" type="button">فارسی</button>
      <button id="logout" class="link" hidden data-i18n="signOut">Sign out</button>
    </div>
  </header>

  <!-- Signed out -->
  <main id="view-auth" class="auth" hidden>
    <section class="intro">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
    </section>
    <form id="auth-form" class="panel" novalidate>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="register" aria-selected="true" data-i18n="tabRegister"></button>
        <button type="button" role="tab" data-mode="login" aria-selected="false" data-i18n="tabLogin"></button>
      </div>
      <label data-only="register"><span data-i18n="fullName"></span><input name="full_name" autocomplete="name"></label>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="email" dir="ltr" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" minlength="8" autocomplete="current-password" dir="ltr" required></label>
      <p class="error" role="alert"></p>
      <button class="primary" type="submit"></button>
    </form>
  </main>

  <!-- Signed in -->
  <main id="view-app" hidden>
    <section id="subscription" class="notice" hidden>
      <div>
        <h2 data-i18n="subTitle"></h2>
        <p data-i18n="subText"></p>
      </div>
      <button id="subscribe" class="primary" data-i18n="payBtn"></button>
    </section>

    <section class="grid">
      <div class="wheel-col">
        <figure id="wheel" class="wheel">
          <p class="empty" data-i18n="wheelEmpty"></p>
        </figure>
        <p id="big-three" class="big-three"></p>
      </div>

      <div class="side">
        <form id="birth-form" class="panel">
          <h2 data-i18n="birthTitle"></h2>
          <label><span data-i18n="birthDate"></span><input name="birth_date" type="date" required></label>
          <label><span data-i18n="birthTime"></span> <span class="hint" data-i18n="birthTimeHint"></span>
            <input name="birth_time" type="time"></label>
          <label><span data-i18n="birthPlace"></span><input name="birth_place" data-i18n-ph="placePh" required></label>
          <p class="error" role="alert"></p>
          <button class="primary" type="submit" data-i18n="calcBtn"></button>
          <p id="birth-saved" class="hint"></p>
        </form>
      </div>
    </section>

    <section id="placements" class="panel" hidden>
      <h2 data-i18n="placementsTitle"></h2>
      <div class="table-wrap"><table><thead><tr><th data-i18n="thBody"></th><th data-i18n="thPos"></th><th data-i18n="thHouse"></th></tr></thead><tbody></tbody></table></div>
    </section>

    <section class="panel report" id="report-panel" hidden>
      <h2 data-i18n="reportTitle"></h2>
      <div id="report"></div>
    </section>

    <section class="panel reading" id="today-panel" hidden>
      <h2 data-i18n="todayTitle"></h2>
      <div id="today"></div>
    </section>

    <section class="panel" id="ask-panel" hidden>
      <h2 data-i18n="askTitle"></h2>
      <form id="ask-form">
        <textarea name="question" rows="3" data-i18n-ph="askPh" required></textarea>
        <p class="error" role="alert"></p>
        <button class="primary" type="submit" data-i18n="askBtn"></button>
      </form>
      <ol id="history" class="history"></ol>
    </section>

    <section class="panel" id="settings">
      <h2 data-i18n="notifTitle"></h2>
      <label class="row"><span data-i18n="sendAt"></span>
        <select name="notify_hour" dir="ltr"></select> <span data-i18n="localTime"></span></label>
      <label class="row check"><input type="checkbox" name="notify_email"> <span data-i18n="emailMe"></span></label>
      <p id="telegram"></p>
      <button id="delete-account" class="link danger" data-i18n="deleteAcc"></button>
    </section>

    <p class="disclaimer" data-i18n="disclaimer"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
